<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f3d3e">
  <meta name="color-scheme" content="light dark">
  <title>Sana Alamgeer</title>
  <meta name="description" content="Academic website of Dr. Sana Alamgeer">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script type="application/ld+json" id="structured-data"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header" id="site-header">
    <div class="container nav-shell">
      <a class="brand" href="#top" aria-label="Home"><span class="brand-mark">SA</span><span id="brand-name"></span></a>
      <button class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="site-nav">Menu</button>
      <nav id="site-nav" class="site-nav" aria-label="Primary navigation"></nav>
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle color theme" title="Toggle theme">◐</button>
    </div>
  </header>

  <main id="main">
    <section class="hero" id="top">
      <div class="hero-grid container">
        <div class="hero-copy reveal">
          <p class="eyebrow" id="hero-role"></p>
          <h1 id="hero-name"></h1>
          <p class="hero-headline" id="hero-headline"></p>
          <p class="hero-subheadline" id="hero-subheadline"></p>
          <!-- <div class="hero-actions" id="hero-actions"></div> -->
          <div class="social-row" id="social-row" aria-label="Profile links"></div>
        </div>
        <div class="hero-visual reveal" aria-label="Multimodal AI research visual">
          <div class="orbit-card">

            <div class="core">
              <span>Multimodal</span>
              <strong>AI</strong>
            </div>

            <div class="orbit-ring">

              <div class="orb-slot orb-1">
                <div class="orb" data-orb="0"></div>
              </div>

              <div class="orb-slot orb-2">
                <div class="orb" data-orb="1"></div>
              </div>

              <div class="orb-slot orb-3">
                <div class="orb" data-orb="2"></div>
              </div>

              <div class="orb-slot orb-4">
                <div class="orb" data-orb="3"></div>
              </div>

              <div class="orb-slot orb-5">
                <div class="orb" data-orb="4"></div>
              </div>

              <div class="orb-slot orb-6">
                <div class="orb" data-orb="5"></div>
              </div>

              <svg class="network-lines" viewBox="0 0 500 500" aria-hidden="true">
                <line x1="250" y1="250" x2="250" y2="58"/>
                <line x1="250" y1="250" x2="418" y2="145"/>
                <line x1="250" y1="250" x2="418" y2="355"/>
                <line x1="250" y1="250" x2="250" y2="442"/>
                <line x1="250" y1="250" x2="82" y2="355"/>
                <line x1="250" y1="250" x2="82" y2="145"/>
              </svg>

            </div>

          </div>

          </div>
        </div>
      </div>

    </section>

    <section class="section" id="research">
      <div class="container"><div class="section-head reveal" id="research-head"></div><div id="research-content"></div></div>
    </section>

    <section class="section section-tint" id="publications">
      <div class="container"><div class="section-head reveal" id="publications-head"></div><div id="publications-content"></div></div>
    </section>

    <section class="section" id="projects">
      <div class="container"><div class="section-head reveal" id="projects-head"></div><div class="project-grid" id="project-grid"></div></div>
    </section>

    <section class="section section-tint" id="experience">
      <div class="container"><div class="section-head reveal" id="career-head"></div><div id="career-content"></div></div>
    </section>

    <section class="section" id="teaching">
      <div class="container"><div class="section-head reveal" id="teaching-head"></div><div id="teaching-content"></div></div>
    </section>

    <section class="section section-tint" id="service">
      <div class="container"><div class="section-head reveal" id="service-head"></div><div id="service-content"></div></div>
    </section>

    <section class="section" id="resources">
      <div class="container"><div class="section-head reveal" id="resources-head"></div><div class="resource-grid" id="resources-content"></div></div>
    </section>

    <section class="section contact-section" id="contact">
      <div class="container contact-card reveal" id="contact-content"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <span id="footer-copy"></span>

      <div class="footer-actions">
        <span id="footer-update"></span>
        <button class="top-button" id="top-button" type="button">Top ↑</button>
      </div>
    </div>
  </footer>
  <noscript><div class="noscript">Please enable JavaScript to view this website.</div></noscript>
  <script src="assets/js/app.js" defer></script>

</html>
